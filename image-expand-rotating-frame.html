<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Image Expand — Rotating Border</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #ecedf4;
    --muted: #9ea4b6;
    --page: #10121a;
    --gold: #f1d0a4;
    --duration: 2750ms; /* Exact opening transition length. */
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(ellipse at 49% 32%, #27243b 0%, transparent 55%),
      linear-gradient(145deg, #121521, var(--page));
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  body.viewer-open { overflow: hidden; }
  main {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 40px 22px;
  }
  .demo { width: min(100%, 620px); text-align: center; }
  .eyebrow { color: var(--gold); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; font-weight: 700; }
  h1 { margin: 12px 0 8px; font-size: clamp(26px, 4vw, 40px); font-weight: 550; letter-spacing: -.035em; }
  p { margin: 0 auto 29px; color: var(--muted); font-size: 14px; line-height: 1.6; max-width: 450px; }
  .image-button {
    position: relative;
    width: min(330px, 74vw);
    padding: 0;
    border: 0;
    background: transparent;
    border-radius: 16px;
    cursor: zoom-in;
    -webkit-tap-highlight-color: transparent;
  }
  .image-button::before {
    content: "";
    position: absolute;
    inset: -8px;
    border: 1.5px solid var(--gold);
    border-radius: 23px;
    opacity: .8;
    transition: opacity .2s;
  }
  .image-button:hover::before { opacity: 1; }
  .image-button:focus-visible, .choose:focus-visible, .viewer-close:focus-visible {
    outline: 3px solid #c7b8ff; outline-offset: 8px;
  }
  #thumbnail {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 16px;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    box-shadow: 0 18px 50px #0006;
  }
  .below { margin-top: 24px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .hint { font-size: 12px; color: var(--muted); }
  .choose {
    border: 1px solid #54566b;
    background: #232536;
    color: var(--ink);
    border-radius: 999px;
    padding: 11px 19px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .choose:hover { background: #33364a; }
  #fileInput { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  /* The frame intentionally sits BEHIND the image throughout the rotation,
     so its long edges can never cross over the picture itself. */
  .viewer {
    position: fixed;
    inset: 0;
    z-index: 1000;
    visibility: hidden;
    pointer-events: none;
  }
  .viewer.is-active { visibility: visible; pointer-events: auto; }
  .backdrop { position: absolute; inset: 0; background: rgba(8, 9, 16, .93); opacity: 0; cursor: zoom-out; }
  .frame {
    position: fixed;
    border: 2px solid var(--gold);
    border-radius: 14px;
    box-shadow: 0 0 26px #eecb9c2c, inset 0 0 20px #eecb9c20;
    transform-origin: center;
    pointer-events: none;
    z-index: 2;
    will-change: width, height, left, top, transform;
  }
  .expanded {
    position: fixed;
    z-index: 3;
    display: block;
    object-fit: cover;
    border-radius: 14px;
    box-shadow: 0 25px 95px #0009;
    pointer-events: none;
    will-change: width, height, left, top;
  }
  .viewer-close {
    position: fixed;
    right: 20px;
    top: 20px;
    z-index: 4;
    border: 1px solid #ffffff3b;
    border-radius: 999px;
    background: #252737;
    color: white;
    padding: 11px 17px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    opacity: 0;
  }
  .viewer-close:hover { background: #45485a; }
  @media (max-width: 480px) { .viewer-close { top: 14px; right: 14px; } }
</style>
</head>
<body>
<main id="page">
  <div class="demo">
    <div class="eyebrow">Interactive transition</div>

<script>
(() => {
  'use strict';

  // CONFIGURATION: change this to any duration in milliseconds.
  const OPEN_MS = 2750;
  const CLOSE_MS = 520;
  const reduceMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const duration = (ms) => reduceMotion() ? 1 : ms;
  const easing = 'cubic-bezier(.37, .04, .14, 1)';

  const page = document.getElementById('page');
  const thumbnail = document.getElementById('thumbnail');
  const imageButton = document.getElementById('openImage');
  const viewer = document.getElementById('viewer');
  const expanded = document.getElementById('expandedImage');
  const frame = document.getElementById('rotatingFrame');
  const backdrop = document.getElementById('backdrop');
  const closeButton = document.getElementById('closeImage');
  const input = document.getElementById('fileInput');
  const choose = document.getElementById('chooseImage');

  let status = 'closed';
  let originalFocus = null;
  let pickedUrl = null;
  let origin = null;
  let destination = null;

  function setStyles(node, styles) { Object.assign(node.style, styles); }
  function toBox(r) { return { x: r.left, y: r.top, w: r.width, h: r.height }; }
  function center(box) { return { x: box.x + box.w / 2, y: box.y + box.h / 2 }; }
  function between(a, b, t) { return a + (b - a) * t; }

  function targetBox() {
    // Preserve the actual image proportions at any viewport size.
    const ratio = (thumbnail.naturalWidth || 4) / (thumbnail.naturalHeight || 3);
    const maxW = innerWidth * (innerWidth < 600 ? .86 : .80);
    const maxH = innerHeight * .74;
    const w = Math.min(maxW, maxH * ratio);
    const h = w / ratio;
    return { x: (innerWidth - w) / 2, y: (innerHeight - h) / 2, w, h };
  }

  function imageKey(box, radius) {
    return {
      left: `${box.x}px`, top: `${box.y}px`,
      width: `${box.w}px`, height: `${box.h}px`,
      borderRadius: `${radius}px`
    };
  }

  function borderKey(cx, cy, w, h, deg, offset) {
    return {
      offset,
      left: `${cx}px`, top: `${cy}px`,
      width: `${w}px`, height: `${h}px`,
      transform: `translate(-50%, -50%) rotate(${deg}deg)`
    };
  }

  function borderSequence(from, to) {
    const a = center(from), b = center(to);
    // At the end, width and height are SWAPPED because a 90° rotated
    // rectangle must visually match the unrotated image's aspect ratio.
    // At 66% it contracts behind the image; at 88% it flares outward;
    // the last 12% contracts again to settle neatly around its edges.
    const m36w = between(from.w, to.w, .36);
    const m36h = between(from.h, to.h, .36);
    const m66w = between(from.w, to.w, .66);
    const m66h = between(from.h, to.h, .66);
    return [
      borderKey(a.x, a.y, from.w + 20, from.h + 20, 0, 0),
      borderKey(between(a.x,b.x,.36), between(a.y,b.y,.36), m36w + 42, m36h + 42, 30, .36),
      borderKey(between(a.x,b.x,.66), between(a.y,b.y,.66), m66h * .77, m66w * .77, 73, .66),
      borderKey(between(a.x,b.x,.88), between(a.y,b.y,.88), to.h + 90, to.w + 90, 90, .88),
      borderKey(b.x, b.y, to.h + 20, to.w + 20, 90, 1)
    ];
  }

  function positionFrame(key) {
    setStyles(frame, {
      left: key.left, top: key.top,
      width: key.width, height: key.height,
      transform: key.transform
    });
  }

  function animate(node, keys, ms, curve = easing) {
    return node.animate(keys, {
      duration: duration(ms), easing: curve, fill: 'forwards'
    });
  }

  async function expandImage() {
    if (status !== 'closed' || !thumbnail.complete) return;
    status = 'opening';
    originalFocus = document.activeElement;
    origin = toBox(thumbnail.getBoundingClientRect());
    destination = targetBox();

    expanded.src = thumbnail.src;
    expanded.alt = thumbnail.alt;
    setStyles(expanded, imageKey(origin, 16));
    const frameKeys = borderSequence(origin, destination);
    positionFrame(frameKeys[0]);

    viewer.classList.add('is-active');
    viewer.setAttribute('aria-hidden', 'false');
    document.body.classList.add('viewer-open');
    thumbnail.style.visibility = 'hidden';

    const animations = [
      animate(expanded, [imageKey(origin, 16), imageKey(destination, 12)], OPEN_MS),
      animate(frame, frameKeys, OPEN_MS),
      animate(backdrop, [{ opacity: 0 }, { opacity: 1 }], OPEN_MS),
      animate(closeButton, [{ opacity: 0 }, { opacity: 1 }], OPEN_MS)
    ];

    try { await Promise.all(animations.map(a => a.finished)); }
    catch { return; }

    setStyles(expanded, imageKey(destination, 12));
    positionFrame(frameKeys[frameKeys.length - 1]);
    backdrop.style.opacity = '1';
    closeButton.style.opacity = '1';
    animations.forEach(a => a.cancel());
    page.inert = true;
    closeButton.focus({ preventScroll: true });
    status = 'open';
  }

  async function collapseImage() {
    if (status !== 'open') return;
    status = 'closing';
    page.inert = false;
    const start = destination;
    const end = toBox(thumbnail.getBoundingClientRect());
    const c = center(end);
    const finalFrame = borderKey(c.x, c.y, end.w + 20, end.h + 20, 0, 1);
    const currentFrame = borderSequence(origin, destination).at(-1);

    const animations = [
      animate(expanded, [imageKey(start, 12), imageKey(end, 16)], CLOSE_MS),
      animate(frame, [currentFrame, finalFrame], CLOSE_MS),
      animate(backdrop, [{ opacity: 1 }, { opacity: 0 }], CLOSE_MS),
      animate(closeButton, [{ opacity: 1 }, { opacity: 0 }], CLOSE_MS)
    ];
    try { await Promise.all(animations.map(a => a.finished)); }
    catch { return; }
    animations.forEach(a => a.cancel());
    thumbnail.style.visibility = 'visible';
    viewer.classList.remove('is-active');
    viewer.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('viewer-open');
    status = 'closed';
    if (originalFocus?.focus) originalFocus.focus({ preventScroll: true });
  }

  imageButton.addEventListener('click', expandImage);
  closeButton.addEventListener('click', collapseImage);
  backdrop.addEventListener('click', collapseImage);
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && status === 'open') collapseImage();
  });

  choose.addEventListener('click', () => input.click());
  input.addEventListener('change', () => {
    const file = input.files?.[0];
    if (!file || !file.type.startsWith('image/')) return;
    if (pickedUrl) URL.revokeObjectURL(pickedUrl);
    pickedUrl = URL.createObjectURL(file);
    thumbnail.src = pickedUrl;
    thumbnail.alt = file.name;
    thumbnail.style.aspectRatio = 'auto';
    input.value = '';
  });
})();
</script>
</body>
</html>
